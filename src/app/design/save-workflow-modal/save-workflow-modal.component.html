<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">

    <div class="modal-header">
      <h2 id="modal-title" class="modal-title">Save Workflow</h2>
      <button class="modal-close" (click)="onCancel()" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">

      <!-- Name -->
      <div class="field" [class.field--error]="nameError()">
        <label class="field-label" for="wf-name">
          Name <span class="required">*</span>
        </label>
        <input
          id="wf-name"
          class="field-input"
          type="text"
          placeholder="e.g. Order Processing Flow"
          [value]="name()"
          (input)="onNameChange($any($event.target).value)"
          [disabled]="saving()"
          autocomplete="off"
        />
        @if (nameError()) {
          <span class="field-error">{{ nameError() }}</span>
        }
      </div>

      <!-- Description -->
      <div class="field">
        <label class="field-label" for="wf-desc">Description</label>
        <textarea
          id="wf-desc"
          class="field-input field-textarea"
          placeholder="Briefly describe what this workflow does…"
          rows="3"
          [value]="description()"
          (input)="onDescriptionChange($any($event.target).value)"
          [disabled]="saving()"
        ></textarea>
      </div>

      <!-- Summary -->
      <div class="summary">
        <span class="summary-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
          {{ nodes.length }} node{{ nodes.length !== 1 ? 's' : '' }}
        </span>
        <span class="summary-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
          {{ connections.length }} connection{{ connections.length !== 1 ? 's' : '' }}
        </span>
      </div>

      <!-- API error -->
      @if (error()) {
        <div class="api-error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ error() }}
        </div>
      }
    </div>

    <div class="modal-footer">
      <button class="btn btn--ghost" (click)="onCancel()" [disabled]="saving()">Cancel</button>
      <button class="btn btn--primary" (click)="onSave()" [disabled]="saving()">
        @if (saving()) {
          <span class="spinner"></span> Saving…
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
          </svg>
          Save Workflow
        }
      </button>
    </div>

  </div>
</div>
